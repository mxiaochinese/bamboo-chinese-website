name: Deploy Bamboo Chinese to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare project-site paths
        run: |
          cp -R dist _site
          python3 - <<'PY'
          from pathlib import Path
          import re

          base = "/bamboo-chinese-website"
          for path in Path("_site").rglob("*"):
              if path.is_file() and path.suffix.lower() in {".html", ".css", ".js", ".json"}:
                  text = path.read_text(encoding="utf-8")
                  text = re.sub(r'(["\'])(/)(?!/)', rf'\1{base}/', text)
                  path.write_text(text, encoding="utf-8")
          PY
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
